<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Files on PC</title>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #FAFAFA;
    --border: #EAEAEA;
    --text-primary: #000000;
    --text-secondary: #666666;
    --accent: #000000;
    --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-6: 24px; --space-8: 32px;
    --radius-sm: 2px; --radius-md: 4px;
    --transition-micro: 100ms ease;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: var(--space-8) var(--space-4);
    max-width: 600px;
    margin-inline: auto;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  h1 {
    font-family: 'Geist', 'Helvetica Neue', sans-serif;
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 var(--space-6) 0;
    letter-spacing: -0.01em;
  }
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-6);
    margin-bottom: var(--space-6);
  }
  .file-list { list-style: none; margin: 0; padding: 0; }
  .file-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 36px;
    padding: 0 var(--space-3);
    border-bottom: 1px solid var(--border);
    transition: background var(--transition-micro);
  }
  .file-row:last-child { border-bottom: none; }
  .file-row:hover { background: var(--surface); }
  .file-row a {
    color: var(--text-primary);
    text-decoration: none;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .download-icon { color: var(--text-secondary); font-size: 12px; }
  .empty-state {
    text-align: center;
    padding: var(--space-8) 0;
  }
  .empty-state h2 {
    font-family: 'Geist', 'Helvetica Neue', sans-serif;
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 var(--space-2) 0;
  }
  .empty-state p {
    color: var(--text-secondary);
    font-size: 14px;
    margin: 0;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 36px;
    padding: 0 var(--space-4);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background var(--transition-micro), color var(--transition-micro);
  }
  .btn-secondary {
    background: transparent;
    color: var(--text-primary);
    border: 1px solid var(--text-primary);
    width: 100%;
  }
  .btn-secondary:hover { background: var(--text-primary); color: #FFFFFF; }
</style>
</head>
<body>
  <h1>Files on PC</h1>
  <div class="card">
